  - aid: api-blueprint:api-blueprint-api
    name: API Blueprint API
    description: >-
      The API Blueprint API is the parsing service operated at
      api.apiblueprint.org by the API Blueprint project. It parses API Blueprint
      and Swagger 2.0 documents into the Refract Parse Result Namespace (API
      Elements) and composes API Blueprint back out of API Elements. The service
      is open, requires no authentication or API key, and is driven entirely by
      HTTP content negotiation. Probed live and answering on 2026-09-02 even
      though every apiaryio GitHub repository was archived on 2024-11-08.
    humanURL: https://apiblueprintapi.docs.apiary.io/
    baseURL: https://api.apiblueprint.org
    tags:
