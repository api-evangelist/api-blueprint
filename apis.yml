aid: api-blueprint
name: API Blueprint
description: >-
  API Blueprint is a high-level API description language using Markdown-based
  syntax for designing, documenting, and prototyping web APIs. Created by
  Apiary and released under the MIT License, API Blueprint uses .apib files
  with a concise Markdown format that makes APIs accessible to both technical
  and non-technical stakeholders. The project is no longer actively maintained
  (all apiaryio GitHub repos are archived as of 2024) but remains a notable
  specification in API design history, influencing later formats like OpenAPI.
