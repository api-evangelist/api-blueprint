contract_drift:
  - finding: >-
      The live service root advertises two affordances the provider's published
      contract does not describe — `validate` (/validate) and `transform`
      (/transform).
    evidence: >-
      GET https://api.apiblueprint.org/ returned _links containing self,
      validate, transform, parse and compose on 2026-09-02, while
      apib/root.apib documents only self, parse and compose.
    impact: >-
      Two working operations are undiscoverable from the documentation. Both are
      modeled in openapi/api-blueprint-parsing-service-openapi.yml with an
      x-probed evidence block.
  - finding: >-
      The live service accepts application/vnd.oai.openapi as an input media
      type; the published contract lists only text/vnd.apiblueprint,
      text/vnd.legacyblueprint and application/swagger.
    evidence: >-
      The 415 message returned by POST /validate on 2026-09-02 names
      application/vnd.oai.openapi among the supported MIME types.
    impact: OpenAPI 3 input support exists but is undocumented.
  - finding: >-
      The profile Link header on the live service root points at
      https://plutonium.docs.apiary.io, while apib/root.apib says the header
      should point at http://docs.apiblueprint.apiary.io.
    evidence: >-
      Response header observed on GET https://api.apiblueprint.org/,
      2026-09-02: 'Link: <https://plutonium.docs.apiary.io>; rel="profile"'.
    impact: >-
      An agent following the profile link is sent to an internal-looking host
      rather than to the documented one.
