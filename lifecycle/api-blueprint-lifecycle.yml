  archived: true
  archived_on: '2024-11-08'
  scope: >-
    The whole apiaryio GitHub organization, marked archived by an administrator.
    apiaryio/api-blueprint is archived with default branch master, last pushed
    2023-08-19, MIT licensed, 8,634 stars.
  accepting_issues: false
  evidence: https://github.com/apiaryio
service:
