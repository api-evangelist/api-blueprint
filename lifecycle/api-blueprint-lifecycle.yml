headline: >-
  ARCHIVED PROJECT, LIVE SERVICE. Every apiaryio repository — the specification,
  the parsers, Dredd, the website and the API's own contract — was archived on
  2024-11-08 and is read-only. The parsing service at api.apiblueprint.org was
  nonetheless probed live and fully functional on 2026-09-02. Consumers should
  treat it as running on borrowed time: there is no owner accepting issues, no
  SLA, no status page and no deprecation policy that would warn them before it
  stops.
status: archived-but-operating
